<!DOCTYPE html>
<!-- This is a mini project to test your typing speed made by siddhant kanawade -->
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Typing Speed Test Game | SK Codes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
   
    <div class="wrapper">
       
        <input type="text" class="input-field">
        <div class="content-box">
            <div class="typing-text">
                <p></p>
            </div>
            <div class="content">
                <ul class="result-details">
                    <li class="time">
                        <p>Time Left:</p>
                        <span id="TimeLeft"><b></b></span>
                    </li>
                    <li class="mistake">
                        <p>Mistakes:</p>
                        <span>0</span>
                    </li>
                    <li class="wpm">
                        <p>WPM:</p>
                        <span id="wpm">0</span>
                    </li>

                </ul>   
                <button>START</button>
            </div>
        </div>
    </div>


<!-- //====================popup========================================== -->

<div class="container" id="container">
    <div class="popup">
        
        <div class="title">Share it with your friends</div>
        <div class="header">Or share via link</div>
        
        <div>&nbsp;</div>
        <div class="socials">
            <div class="icon whatsapp scale" id="whatsapp">
                <i class="ri-whatsapp-line"><img src="whatsapp11.png" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>
            
            <div class="icon fb scale" id="fb">
                <i class="ri-twitter-x-line"><img src="Facebook_logo_(square).png" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>
            
            <div class="icon twitter scale" id="twitter">
                <i class="ri-twitter-x-line"><img src="x1.avif" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>

            <div class="icon instagram scale" id="instagram">
            <i class="ri-instagram-line"><img src="insta1.png" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>

            <div class="icon pinterest scale" id="pinterest">
            <i class="ri-twitter-x-line"><img src="pinterest log.avif" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>

            <div class="icon telegram scale" id="telegram">
            <i class="ri-twitter-x-line"><img src="telegram-512.webp" alt="" class="images"></i>
            </div>
            <div>&nbsp;</div>


    </div>

    
    <i class="ri-close-line close" id="close" onclick="closePopupCard()"><img src="close-line.png" alt=""></i>
</div>

</div>

<div class="share-btn" id="share-btn"></div>

   
    <script src="para.js"></script>
    <script src="script.js"></script>
    
    
   
</body>

</html>
